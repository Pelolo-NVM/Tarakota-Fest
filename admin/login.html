<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Tarakota Fest 2026</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/sticker-star-yellow.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-page="admin-login">
  <main class="admin-login-shell">
    <section class="admin-login-card" aria-labelledby="admin-login-title">
      <img src="../assets/images/tarakota-logo.svg" alt="Tarakota Fest" width="110" height="66" style="margin-bottom:0.75rem;">
      <span class="status-badge status-badge--lilac">Area Terpisah Administrator</span>
      <h1 id="admin-login-title" style="margin-top:0.5rem; margin-bottom:0.35rem; font-size:var(--text-xl);">Portal Backoffice Admin</h1>
      <p style="color:var(--color-ink-muted); font-size:var(--text-sm); margin-bottom:1.25rem;">Masuk menggunakan sesi autentikasi resmi untuk mengelola event, memverifikasi transaksi, dan mengkurasi band.</p>

      <div id="admin-login-error" class="alert-box alert-box--error" role="alert" hidden></div>

      <form id="admin-login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="admin-email">Email Administrator</label>
          <input class="field-input" id="admin-email" name="email" type="email" required value="admin@tarakota.id" autocomplete="username">
        </div>

        <div class="field-group">
          <label class="field-label" for="admin-password">Kata Sandi</label>
          <input class="field-input" id="admin-password" name="password" type="password" required placeholder="Masukkan kata sandi admin" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-secondary" id="admin-login-btn" style="width:100%;">Masuk ke Dashboard Admin</button>
      </form>

      <div class="admin-demo-box">
        <strong>Akun Demo Lokal (Seed Database):</strong><br>
        Email: <span class="mono">admin@tarakota.id</span><br>
        Sandi: <span class="mono">tarakota2026</span>
      </div>

      <p style="margin:1rem 0 0; text-align:center;">
        <a href="../index.html" style="font-weight:700; color:var(--color-ink-espresso);">&larr; Kembali ke Portal Publik</a>
      </p>
    </section>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/pages/admin-login.js"></script>
</body>
</html>
